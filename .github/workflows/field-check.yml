name: Field Check

on:
  workflow_dispatch: {}   # manual trigger only

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run field check
        run: python3 field_check.py
